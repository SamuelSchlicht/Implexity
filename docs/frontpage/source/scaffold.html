<!doctype html><html lang="en"><meta charset="utf-8"><title>scaffold</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0}

</style><body><div class="canvas"><div class="panels">
<div class="panel"><img src="inputs/scaffold-0.png" alt="Symmetry-edge point load"><div class="label">Symmetry-edge point load</div></div>

</div></div></body></html>

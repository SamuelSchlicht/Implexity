[package]
autotests = false
name = "implexity-bundle"
description = "The bundled distributions: links every enabled package (cargo features) and"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
implexity-core = { workspace = true }
implexity-physics-base = { workspace = true }
implexity-physics-solid = { workspace = true }
implexity-physics-cfd = { workspace = true }
implexity-physics-thermofluid = { workspace = true }
implexity-physics-compressible = { workspace = true }
implexity-physics-fields = { workspace = true }
implexity-physics-lbm = { workspace = true }
implexity-physics-fsi = { workspace = true, optional = true }
implexity-jobs = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["dynamic"]
 
dynamic = [
  "dep:implexity-physics-fsi",
  "implexity-physics-lbm/moving",
]

[lints]
workspace = true

[lib]
test = false
doctest = false

[package]
autotests = false
name = "implexity-render-egl"
description = "Optional EGL/GLES offscreen execution of the canonical GUI shaders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
test = false
name = "implexity-egl-worker"
path = "src/bin/implexity-egl-worker.rs"

[dependencies]
implexity-io = { workspace = true }
implexity-render = { workspace = true, features = ["viewer-capture"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["egl"]
 
 
 
egl = []

 
 
 
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[lib]
test = false
doctest = false

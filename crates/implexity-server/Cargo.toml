[package]
autotests = false
name = "implexity-server"
description = "The loopback HTTP + WebSocket service, compatible with the unchanged browser GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
implexity-core = { workspace = true }
implexity-io = { workspace = true }
implexity-geometry = { workspace = true }
implexity-mesh = { workspace = true }
implexity-runtime = { workspace = true }
implexity-agent = { workspace = true }
implexity-render = { workspace = true, features = ["viewer-capture"] }
implexity-authoring = { workspace = true }
implexity-jobs = { workspace = true }
ndarray = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[features]
default = ["dynamic-results"]
 
 
 
 
dynamic-results = ["implexity-agent/dynamic-results", "implexity-render/dynamic"]


[lints]
workspace = true

[lib]
test = false
doctest = false

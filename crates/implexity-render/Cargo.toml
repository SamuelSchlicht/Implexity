[package]
autotests = false
name = "implexity-render"
description = "Bounded, deterministic renderings for the agent API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
implexity-core = { workspace = true }
implexity-mesh = { workspace = true }
implexity-geometry = { workspace = true }
implexity-io = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rayon = { workspace = true }
gif = { workspace = true, optional = true }
image-webp = { workspace = true, optional = true }
less-avc = { workspace = true, optional = true }

[features]
default = ["viewer-capture", "dynamic"]
 
 
 
dynamic = ["dep:gif", "dep:image-webp", "dep:less-avc"]
 
 
viewer-capture = []

[lints]
workspace = true

[lib]
test = false
doctest = false

[[bin]]
name = "implexity-mesh-scene"
path = "src/bin/implexity-mesh-scene.rs"
test = false
